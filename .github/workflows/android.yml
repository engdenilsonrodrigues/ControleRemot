name: App Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ControleFlexo.apk

      - name: Publicar versao
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: Controle Flexo 1.0.${{ github.run_number }}
          make_latest: true
          files: ControleFlexo.apk
          body: |
            App Android do Controle Flexo (Bluetooth).
            Baixe **ControleFlexo.apk** no celular e instale (permita "instalar apps desconhecidos").
